
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>TaskFlow</h1>
    <p>Manage your daily tasks.</p>

    <form id="task-form">
      <input id="task-input" type="text"
        placeholder="Enter a task..." required>
      <button type="submit">Add Task</button>
    </form>
    
<input id="task-search" type="search"
  placeholder="Search tasks...">


    <div class="filters">
      <button type="button" data-filter="all">All</button>
      <button type="button" data-filter="pending">Pending</button>
      <button type="button" data-filter="completed">Completed</button>
    </div>

    <ul id="task-list"></ul>
    <p id="task-count">0 tasks</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
